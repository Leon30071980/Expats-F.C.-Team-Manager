<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1426" />
  <meta name="description" content="Expats F.C. — Rosa, risultati, presenze, gol, assist e statistiche stagionali." />
  <title>Expats F.C. — Team Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Exo+2:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1.22" />
  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js?v=1.22" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Navigazione">
    <div class="brand">
      <div class="crest" aria-hidden="true"><img src="logo-expats.png" alt="" /></div>
      <div><div class="brand-name">EXPATS <span>F.C.</span></div><div class="brand-sub">TEAM MANAGER</div><div class="app-version">v1.22</div></div>
    </div>
    <div class="nav-heading">SQUADRA</div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-bottom">
      <div class="club-mini"><span class="online-indicator" id="live-dot"></span><div><strong id="sidebar-source">Anteprima dimostrativa</strong><small id="sidebar-caption">Dati non sincronizzati</small></div></div>
      <div class="sidebar-footer">© Expats F.C. · 2026</div>
    </div>
  </aside>
  <div class="main-column">
    <header class="topbar">
      <div class="topbar-left"><span class="topbar-kicker">CENTRO STATISTICHE</span><span class="topbar-separator">/</span><span id="current-label">Panoramica</span></div>
      <div class="topbar-actions">
        <label class="select-label" for="season-select">STAGIONE</label>
        <select id="season-select" aria-label="Seleziona stagione"></select>
        <button class="icon-btn" id="refresh-btn" title="Aggiorna dati" aria-label="Aggiorna dati">↻</button>
        <button class="btn btn-outline" id="auth-btn">Accedi con Google</button>
      </div>
    </header>
    <main class="content" id="main-content" tabindex="-1"></main>
    <footer class="main-footer"><span>Expats F.C. • Dati condivisi in sola lettura al pubblico</span><span>Team Manager <strong>v1.22</strong></span></footer>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
</body>
</html>
